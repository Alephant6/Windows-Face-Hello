name: CP harness

# Drives the Credential Provider DLL the way LogonUI would (cp/tests/harness.cpp) against a mock
# pipe service, both running as LocalSystem on the runner. No sign-in screen, camera or model needed.

on:
  push:
    branches: ['test/**']
  workflow_dispatch:

jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Credential Provider DLL
        run: msbuild cp\FaceHelloCP.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Set up MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build harness
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 /W4 /MT /Fe:harness.exe cp\tests\harness.cpp /link ole32.lib shlwapi.lib advapi32.lib gdi32.lib user32.lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywin32
        run: python -m pip install --disable-pip-version-check pywin32

      - name: Run harness as LocalSystem with the mock service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\fh-test'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item cp\x64\Release\FaceHelloCP.dll, harness.exe, cp\tests\mock_service.py $work
          New-Item -ItemType Directory -Force 'C:\ProgramData\FaceHello' | Out-Null
          Set-Content 'C:\ProgramData\FaceHello\lang.txt' 'en' -Encoding ascii -NoNewline
          $py = (Get-Command python).Source
          $user = $env:USERNAME
          $sid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          Write-Host "runner account: $user"

          # Test-only LSA secret for the runner account. The harness only checks that a credential
          # blob is produced; nothing is ever submitted to a real logon.
          $code = "import sys, win32security; pol = win32security.LsaOpenPolicy(None, win32security.POLICY_CREATE_SECRET); win32security.LsaStorePrivateData(pol, 'L`$FaceHello_' + sys.argv[1], 'harness-only-not-a-real-password'); win32security.LsaClose(pol); print('lsa secret stored')"
          & $py -c $code $user
          if ($LASTEXITCODE -ne 0) { throw 'could not store the test LSA secret' }

          $cmd = @(
            '@echo off',
            "start `"`" /b `"$py`" $work\mock_service.py",
            'ping -n 4 127.0.0.1 >nul',
            "$work\harness.exe $work\FaceHelloCP.dll $sid $user $work\harness.log > $work\harness.out 2>&1",
            "echo %ERRORLEVEL% > $work\exitcode.txt",
            'taskkill /f /im python.exe >nul 2>&1',
            "echo done > $work\done.txt"
          )
          Set-Content "$work\run.cmd" $cmd -Encoding ascii

          schtasks /create /tn fh-harness /ru SYSTEM /sc once /st 00:00 /rl highest /f /tr "$work\run.cmd" | Out-Host
          schtasks /run /tn fh-harness | Out-Host
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Test-Path "$work\done.txt") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }

          Write-Host '===== harness log ====='
          if (Test-Path "$work\harness.log") { Get-Content "$work\harness.log" } else { Write-Host '(no harness.log)' }
          if (Test-Path "$work\harness.out") { Write-Host '===== harness stdout ====='; Get-Content "$work\harness.out" -Tail 20 }
          Write-Host '===== mock service log ====='
          if (Test-Path 'C:\Users\Public\mock-service.log') { Get-Content 'C:\Users\Public\mock-service.log' -Tail 40 }
          if (-not (Test-Path "$work\done.txt")) { throw 'harness did not finish within 4 minutes' }
          $exit = (Get-Content "$work\exitcode.txt" -Raw).Trim()
          if ($exit -ne '0') { throw "harness failed (exit $exit)" }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-harness-logs
          path: |
            C:\fh-test\harness.log
            C:\fh-test\harness.out
            C:\Users\Public\mock-service.log
          if-no-files-found: ignore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FaceHelloCP-dll
          path: cp/x64/Release/FaceHelloCP.dll
          if-no-files-found: error
