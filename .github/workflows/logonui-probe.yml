name: LogonUI probe

# Exploratory: can a hosted Windows runner show a real lock / sign-in screen that a LocalSystem
# helper can capture and type into? Used to decide whether the Credential Provider can be tested
# against a real LogonUI in CI.

on:
  push:
    branches: ['probe/**']

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe session, lock, capture the secure desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force C:\probe | Out-Null
          $o = Get-CimInstance Win32_OperatingSystem
          "OS: $($o.Caption) $($o.Version)"
          "user: $env:USERNAME ; process session id: $((Get-Process -Id $PID).SessionId)"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          "TerminalServerSession: $([System.Windows.Forms.SystemInformation]::TerminalServerSession)"
          "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          '--- qwinsta'; qwinsta 2>&1 | Out-Host
          '--- quser'; quser 2>&1 | Out-Host
          "LogonUI processes before lock: $(@(Get-Process LogonUI -ErrorAction SilentlyContinue).Count)"

          function Save-Shot([string]$path) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save($path); $g.Dispose(); $bmp.Dispose(); "saved $path"
            } catch { "shot failed: $($_.Exception.Message)" }
          }
          Save-Shot 'C:\probe\0-user-desktop.png'

          '--- PsTools'
          try {
            Invoke-WebRequest 'https://download.sysinternals.com/files/PSTools.zip' -OutFile C:\probe\PSTools.zip -UseBasicParsing
            Expand-Archive C:\probe\PSTools.zip C:\probe\pstools -Force
            "PsExec64 present: $(Test-Path C:\probe\pstools\PsExec64.exe)"
          } catch { "PsTools download failed: $($_.Exception.Message)" }

          Set-Content C:\probe\secure.ps1 @'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($p) { try { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save($p); $g.Dispose(); $bmp.Dispose(); Add-Content C:\probe\secure.log "saved $p" } catch { Add-Content C:\probe\secure.log "shot failed $p : $($_.Exception.Message)" } }
          Add-Content C:\probe\secure.log "secure helper start as $([Security.Principal.WindowsIdentity]::GetCurrent().Name) session $((Get-Process -Id $PID).SessionId)"
          Shot 'C:\probe\1-secure-lock.png'
          try { [System.Windows.Forms.SendKeys]::SendWait(' '); Add-Content C:\probe\secure.log 'sent space' } catch { Add-Content C:\probe\secure.log "sendkeys failed: $($_.Exception.Message)" }
          Start-Sleep -Seconds 4
          Shot 'C:\probe\2-secure-after-space.png'
          Add-Content C:\probe\secure.log 'secure helper done'
          '@

          '--- lock'
          rundll32.exe user32.dll,LockWorkStation
          Start-Sleep -Seconds 6
          "LogonUI processes after lock: $(@(Get-Process LogonUI -ErrorAction SilentlyContinue).Count)"
          qwinsta 2>&1 | Out-Host
          Save-Shot 'C:\probe\0b-user-desktop-after-lock.png'

          $sid = (Get-Process -Id $PID).SessionId
          if (Test-Path C:\probe\pstools\PsExec64.exe) {
            '--- secure desktop helper via PsExec -s -i -x'
            & C:\probe\pstools\PsExec64.exe -accepteula -nobanner -s -i $sid -x powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\probe\secure.ps1 2>&1 | Out-Host
            "psexec exit: $LASTEXITCODE"
          }
          Start-Sleep -Seconds 3
          if (Test-Path C:\probe\secure.log) { Get-Content C:\probe\secure.log } else { 'no secure.log' }
          Get-ChildItem C:\probe -File | Select-Object Name, Length | Format-Table -AutoSize | Out-Host
          exit 0

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logonui-probe
          path: |
            C:\probe\*.png
            C:\probe\secure.log
          if-no-files-found: ignore
