name: LogonUI test

# Runs the Credential Provider inside the real LogonUI of the hosted runner (Windows Server, same
# LogonUI generation as Windows 11 24H2): cp/tests/logonui/driver.ps1 locks the console session and a
# LocalSystem helper on the secure desktop captures screenshots and sends input. The face service is
# the mock in cp/tests/mock_service.py.

on:
  push:
    branches: ['ui/**']

jobs:
  logonui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Credential Provider DLL
        run: msbuild cp\FaceHelloCP.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywin32
        run: python -m pip install --disable-pip-version-check pywin32

      - name: Drive the real sign-in screen
        shell: pwsh
        run: ./cp/tests/logonui/driver.ps1 -Dll cp\x64\Release\FaceHelloCP.dll -RoundsFile cp\tests\logonui\rounds.json

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logonui-out
          path: C:\fh-ui\out
          if-no-files-found: ignore

      - name: Upload DLL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceHelloCP-dll
          path: cp/x64/Release/FaceHelloCP.dll
          if-no-files-found: ignore
